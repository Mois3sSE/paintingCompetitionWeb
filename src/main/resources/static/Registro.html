<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painting Competition - Registro</title>
</head>

<body>
    <header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;">
        <div></div>
        <h1 style="margin: 0; text-align: center;">Painting Competition</h1>
        <div></div>
    </header>

    <main>
        <section>
            <h2>Registro</h2>
            <form id="registroForm">
                <div>
                    <label for="usuario">Usuario:</label><br>
                    <input type="text" id="usuario" name="usuario" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()" required>
                </div>
                <br>
                <div>
                    <label for="password">Contraseña:</label><br>
                    <input type="password" id="password" name="password" required>
                </div>
                <br>
                <div>
                    <button type="submit">Crear cuenta</button>
                </div>
            </form>
            <p id="mensajeEstado" style="display: none;"></p>
        </section>
    </main>

    <script>
        document.getElementById('registroForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const usuario = document.getElementById('usuario').value.toUpperCase();
            const password = document.getElementById('password').value;
            const mensajeEstado = document.getElementById('mensajeEstado');
            mensajeEstado.style.display = 'none';

            try {
                const respuesta = await fetch('/api/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    window.location.href = 'logIn.html';
                } else {
                    mensajeEstado.style.color = 'red';
                    mensajeEstado.textContent = datos.mensaje || 'Error al crear la cuenta';
                    mensajeEstado.style.display = 'block';
                }
            } catch (error) {
                mensajeEstado.style.color = 'red';
                mensajeEstado.textContent = 'No se pudo conectar con el servidor.';
                mensajeEstado.style.display = 'block';
            }
        });
    </script>
</body>

</html>
