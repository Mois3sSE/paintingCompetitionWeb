<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painting Competition - Iniciar Sesión</title>
</head>

<body>
    <header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;">
        <div></div>
        <h1 style="margin: 0; text-align: center;">Painting Competition</h1>
        <div></div>
    </header>

    <main>
        <section>
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div>
                    <label for="usuario">Usuario:</label><br>
                    <input type="text" id="usuario" name="usuario" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()" required>
                </div>
                <br>
                <div>
                    <label for="password">Contraseña:</label><br>
                    <input type="password" id="password" name="password" required>
                </div>
                <br>
                <div>
                    <button type="submit">Iniciar sesión</button>
                </div>
            </form>
            <p id="mensajeError" style="color: red; display: none;"></p>
            <p>¿No tienes cuenta?. <a href="Registro.html">Registrate</a></p>
        </section>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            const mensajeError = document.getElementById('mensajeError');
            mensajeError.style.display = 'none';

            try {
                const respuesta = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    sessionStorage.setItem('usuarioActivo', JSON.stringify(datos));
                    window.location.href = 'index.html';
                } else {
                    mensajeError.textContent = datos.mensaje || 'Error al iniciar sesión';
                    mensajeError.style.display = 'block';
                }
            } catch (error) {
                mensajeError.textContent = 'No se pudo conectar con el servidor.';
                mensajeError.style.display = 'block';
            }
        });
    </script>
</body>

</html>
